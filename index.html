<!DOCTYPE html>
<html lang="id">
<head>

    <title>Kios Cell - Solusi Pembayaran Digital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #f5f3ff;
            --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --background: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #f1f5f9;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 10px;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.01);
            --shadow-md: 0 10px 25px -5px rgba(79, 70, 229, 0.08), 0 8px 16px -6px rgba(79, 70, 229, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--background);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 20px;
            background: var(--primary-gradient);
            padding: 28px 24px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .header::after {
            content: '';
            position: absolute;
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            top: -50px;
            right: -35px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.75);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .status-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 4px;
        }
        .operator-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 100px;
            background: #f1f5f9;
            color: #64748b;
            transition: all 0.2s;
        }
        .network-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .grid-item {
            background-color: var(--surface);
            border-radius: var(--radius-md);
            padding: 16px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border-color);
            height: 102px;
            cursor: pointer;
        }

        .icon-wrapper {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 36px;
            width: 36px;
            background: var(--primary-light);
            border-radius: 12px;
            transition: all 0.25s ease;
        }

        .icon-wrapper svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: var(--primary);
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .grid-item span {
            font-size: 11px;
            font-weight: 600;
            color: #334155;
            line-height: 1.3;
            text-align: center;
        }

        @media (hover: hover) {
            .grid-item:hover {
                transform: translateY(-4px);
                box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.05);
                border-color: rgba(79, 70, 229, 0.2);
            }
            .grid-item:hover .icon-wrapper {
                background: var(--primary-gradient);
            }
            .grid-item:hover .icon-wrapper svg {
                stroke: #ffffff;
            }
        }

        .grid-item:active {
            transform: scale(0.95);
            background-color: var(--primary-light);
        }

        .page-content {
            display: none;
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 24px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            text-align: left;
            animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--primary-light);
            border: none;
            color: var(--primary);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 20px;
            padding: 8px 14px;
            border-radius: 100px;
            transition: all 0.2s;
        }

        .btn-back:active {
            transform: scale(0.95);
        }

        .page-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.75px;
        }

        .form-control {
            width: 100%;
            padding: 16px;
            border-radius: var(--radius-md);
            border: 1.5px solid var(--border-color);
            background: #f8fafc;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .group-header {
            font-size: 12px;
            font-weight: 700;
            color: var(--primary);
            margin: 16px 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            max-height: 40vh;
            overflow-y: auto;
            padding: 4px 6px 4px 2px;
            margin-bottom: 12px;
        }

        @media (min-width: 380px) {
            .product-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 10px;
            }
        }

        .product-grid::-webkit-scrollbar {
            width: 5px;
        }
        .product-grid::-webkit-scrollbar-track {
            background: transparent;
        }
        .product-grid::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 20px;
        }

        .product-item {
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background: var(--surface);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-start;
            position: relative;
            overflow: hidden;
            gap: 12px;
        }

        .product-item-left {
            width: 100%;
            padding-right: 20px;
        }

        .prod-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .prod-desc {
            font-size: 10.5px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .prod-price {
            font-size: 13px;
            font-weight: 800;
            color: var(--primary);
            white-space: nowrap;
            background: var(--primary-light);
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            align-self: flex-end;
            transition: all 0.2s;
        }

        .product-item::after {
            content: '✓';
            position: absolute;
            top: 10px;
            right: 12px;
            font-size: 12px;
            font-weight: 900;
            color: var(--primary);
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s ease;
        }

        .product-item.selected {
            border-color: var(--primary);
            background: #fdfcff;
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.08);
            transform: translateY(-1px);
        }

        .product-item.selected .prod-price {
            background: var(--primary-gradient);
            color: #ffffff;
        }

        .product-item.selected::after {
            opacity: 1;
            transform: scale(1);
        }

        .btn-submit {
            width: 100%;
            background: var(--primary-gradient);
            color: #ffffff;
            border: none;
            padding: 18px;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 12px;
            box-shadow: 0 8px 20px -6px rgba(79, 70, 229, 0.4);
            transition: all 0.2s;
        }

        .btn-submit:active {
            transform: scale(0.98);
            box-shadow: none;
        }

        .btn-submit:disabled {
            background: #cbd5e1;
            color: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
        }

        .no-results {
            display: none;
            grid-column: span 3;
            padding: 40px 10px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            text-align: center;
        }

        .footer {
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            margin-top: 30px;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }
    </style>
</head>

function sinkronisasiProduk() {
    fetch('Api/ambil_produk_ready.php')
    .then(res => { if(!res.ok) throw new Error(); return res.json(); })
    .then(data => { 
        if(data && Object.keys(data).length > 0) {
            produkData = data; 
        } else {
            throw new Error();
        }
        render(); 
    })
    .catch(() => { 
        console.log('Menggunakan deep-copy data lokal Kios Cell.'); 
        produkData = JSON.parse(JSON.stringify(backupProdukData));
        render(); 
    });
}

window.addEventListener('online', perbaruiStatusInternet);
window.addEventListener('offline', perbaruiStatusInternet);

function perbaruiStatusInternet() {
    let dot = document.getElementById('status-dot');
    let txt = document.getElementById('status-text');
    if (navigator.onLine) {
        txt.innerText = "Online";
        dot.style.background = "#10b981"; 
    } else {
        txt.innerText = "Offline";
        dot.style.background = "#ef4444"; 
    }
    validasi();
}

            badge.innerText = 'Format Validated'; badge.style.color = '#fff'; badge.style.background = '#4f46e5';
        } else {
            badge.innerText = 'Menunggu ID/Nomor...'; badge.style.color = '#64748b'; badge.style.background = '#f1f5f9';
        }
        render();
        validasi();
        return;
    }

    if(no.length >= 4){
        let prefix = no.substring(0,4);
        
        // Seluruh prefix Telkomsel (Termasuk by.U dan Promo) sekarang diarahkan ke satu kelompok: 'Telkomsel'
        if(['0811','0812','0813','0821','0822','0851','0852','0853'].includes(prefix)){
            operatorAktif='Telkomsel'; 
            badge.innerText='Telkomsel'; 
            badge.style.color='#fff'; 
            badge.style.background='#ef4444';
        }
        else if(['0817','0818','0819','0877','0878'].includes(prefix)){
            operatorAktif='XL'; badge.innerText='XL Axiata'; badge.style.color='#fff'; badge.style.background='#2563eb';
        }
        else if(['0814','0815','0816','0855','0856','0857'].includes(prefix)){
            operatorAktif='Indosat'; badge.innerText='Indosat Ooredoo'; badge.style.color='#fff'; badge.style.background='#eab308';
        }
        else if(['0831','0832','0833','0838'].includes(prefix)){
            operatorAktif='Axis'; badge.innerText='AXIS'; badge.style.color='#fff'; badge.style.background='#a855f7';
        }
        else if(['0895','0896','0897','0898','0899'].includes(prefix)){
            operatorAktif='TRI'; badge.innerText='Tri Indonesia'; badge.style.color='#fff'; badge.style.background='#10b981';
        }
        else{
            operatorAktif=''; badge.innerText='Tidak Dikenal'; badge.style.color='#fff'; badge.style.background='#64748b';
            produkTerpilih = null;
        }
    } else {
        operatorAktif=''; badge.innerText='Menunggu nomor...'; badge.style.color='#64748b'; badge.style.background='#f1f5f9';
        produkTerpilih = null;
    }
    render();
    validasi();
}

document.getElementById('customerInput').addEventListener('input', function(e) {
    let cleanValue = this.value.replace(/\D/g, '');
    if (this.value !== cleanValue) {
        this.value = cleanValue;
    }
    deteksiOperator(cleanValue);
});

function render(){
    let wrapper = document.getElementById('productGrid');
    wrapper.innerHTML = '';
    
    let kategoriData = produkData[kategoriAktif];
    let originalData = null;

    if(['pln', 'game', 'ewallet'].includes(kategoriAktif)) {
        originalData = kategoriData || null;
    } else {
        if(!operatorAktif) {
            wrapper.innerHTML = '<div style="grid-column: 1/-1; text-align:center; color: #64748b; font-size:13px; padding: 20px 0;">Silahkan masukkan nomor HP valid Anda terlebih dahulu.</div>';
            return;
        }
        originalData = kategoriData ? kategoriData[operatorAktif] : null;
    }

    if(!originalData || originalData.length === 0){
        wrapper.innerHTML = '<div style="grid-column: 1/-1; text-align:center; color: #64748b; padding: 20px 0;">Maaf, Produk belum tersedia untuk layanan ini.</div>';
        return;
    }

    let data = [...originalData];
    data.sort((a, b) => a.harga - b.harga);

    let groups = {};
    
    data.forEach(item => {
        let kataNama = item.nama.trim().split(" ");
        let groupName = kataNama.length > 0 ? kataNama[0] : "Lainnya";
        
        if (kataNama[0] === "Internet" || kataNama[0] === "Unlimited") {
            groupName = kataNama[0] + " " + (kataNama[1] || "");
        }

        if (!groups[groupName]) groups[groupName] = [];
        groups[groupName].push(item);
    });

    for (let keyGroupName in groups) {
        let headerEl = document.createElement('div');
        headerEl.className = 'group-header';
        headerEl.style.gridColumn = "1 / -1";
        headerEl.innerHTML = `<i class="fa-solid fa-tags"></i>  ${keyGroupName}`;
        wrapper.appendChild(headerEl);
        
        groups[keyGroupName].forEach(i => {
            let isSelected = (produkTerpilih && produkTerpilih.kode === i.kode) ? 'selected' : '';
            
            let itemEl = document.createElement('div');
            itemEl.className = `product-item ${isSelected}`;
            itemEl.dataset.kode = i.kode;
            itemEl.dataset.nama = i.nama;
            itemEl.dataset.harga = i.harga;
            itemEl.addEventListener('click', function() {
                document.querySelectorAll('.product-item').forEach(c => c.classList.remove('selected'));
                this.classList.add('selected');
                produkTerpilih = {kode: this.dataset.kode, nama: this.dataset.nama, harga: this.dataset.harga};
                validasi();
            });

            itemEl.innerHTML = `
                <div class="product-item-left">
                    <div class="prod-title">${i.nama}</div>
                    <div class="prod-desc">${i.deskripsi || 'Produk Kilat Bagus'}</div>
                </div>
                <div class="prod-price">Rp ${FormatNominal(i.harga)}</div>
            `;
            wrapper.appendChild(itemEl);
        });
    }

    jalankanFilterProduk();
}

function FormatNominal(nilai) {
    return nilai.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

function validasi(){
    let noRaw = document.getElementById('customerInput').value;
    let noClean = noRaw.replace(/\D/g, '');
    let btn = document.getElementById('btnSubmit');
    
    let noValid = false;

    if(['pln', 'game', 'ewallet'].includes(kategoriAktif)) {
        noValid = noClean.length >= 4;
    } else {
        let regexHp = /^08[0-9]{8,11}$/; 
        noValid = regexHp.test(noClean);
    }

    if(noValid && produkTerpilih && navigator.onLine){
        btn.disabled = false;
    } else {
        btn.disabled = true;
    }
}

document.querySelectorAll('#menuGrid .grid-item').forEach(item => {
    item.addEventListener('click', function() {
        kategoriAktif = this.getAttribute('data-id');
        let namaLayanan = this.querySelector('span').innerText;
        
        let inputLabel = document.getElementById('inputLabel');
        let customerInput = document.getElementById('customerInput');

        if(kategoriAktif === 'pln') {
            inputLabel.innerText = "Nomor Meter / ID Pelanggan";
            customerInput.placeholder = "Contoh: 51234567890";
        } else if (kategoriAktif === 'game') {
            inputLabel.innerText = "ID Game / User ID";
            customerInput.placeholder = "Contoh: 12345678 (2024)";
        } else if (kategoriAktif === 'ewallet') {
            inputLabel.innerText = "Nomor HP Akun E-Wallet";
            customerInput.placeholder = "Contoh: 08123456789";
        } else {
            inputLabel.innerText = "Nomor Tujuan";
            customerInput.placeholder = "Contoh: 081234567890";
        }

        document.getElementById('pageTitle').innerText = "Layanan " + namaLayanan;
        document.getElementById('mainView').style.display = 'none';
        document.getElementById('transactionPage').style.display = 'block';
        
        if (!history.state || history.state.page !== 'transaction') {
            history.pushState({page: 'transaction'}, "");
        }
        
        customerInput.value = '';
        document.getElementById('searchProduct').value = ''; 
        operatorAktif = '';
        produkTerpilih = null;
        
        deteksiOperator('');
    });
});

document.getElementById('btnBack').addEventListener('click', function(e) {
    e.preventDefault(); 
    if (history.state && history.state.page === 'transaction') {
        history.back();
    } else {
        document.getElementById('transactionPage').style.display = 'none';
        document.getElementById('mainView').style.display = 'block';
    }
});

window.addEventListener('popstate', function(event) {
    document.getElementById('transactionPage').style.display = 'none';
    document.getElementById('mainView').style.display = 'block';
});

document.getElementById('btnSubmit').addEventListener('click', function() {
    let btn = this;
    let noHp = document.getElementById('customerInput').value.replace(/\D/g, '');

    btn.disabled = true;
    btn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Memproses Transaksi...";

    let dataPayload = {
        nomor_hp: noHp,
        kode_produk: produkTerpilih.kode,
        total_harga: produkTerpilih.harga
    };

    fetch('proses_transaksi.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dataPayload)
    })
    .then(response => { if(!response.ok) throw new Error(); return response.json(); })
    .then(data => {
        if (data.status === 'success') {
            alert('Sukses Buat Pesanan!');
            if(data.redirect_url) window.location.href = data.redirect_url;
        } else {
            alert('Gagal: ' + data.message);
            ResetTombolBeli();
        }
    })
    .catch(() => {
        alert('Simulasi Transaksi Berhasil!\nLayanan: ' + kategoriAktif.toUpperCase() + '\nID/Nomor: ' + noHp + '\nProduk: ' + produkTerpilih.nama + '\nHarga: Rp ' + FormatNominal(produkTerpilih.harga));
        ResetTombolBeli();
    });
});

function ResetTombolBeli() {
    let btn = document.getElementById('btnSubmit');
    btn.disabled = false;
    btn.innerText = "Proses Transaksi";
}

function jalankanFilterProduk() {
    let filter = document.getElementById('searchProduct').value.toLowerCase();
    let productItems = document.querySelectorAll('#productGrid .product-item');
    let groupHeaders = document.querySelectorAll('#productGrid .group-header');

    productItems.forEach(item => {
        let title = item.querySelector('.prod-title').innerText.toLowerCase();
        let desc = item.querySelector('.prod-desc').innerText.toLowerCase();
        
        if (title.includes(filter) || desc.includes(filter)) {
            item.style.display = "flex";
        } else {
            item.style.display = "none";
        }
    });

    groupHeaders.forEach(header => {
        let nextEl = header.nextElementSibling;
        let hasVisibleProduct = false;
        
        while (nextEl && nextEl.classList.contains('product-item')) {
            if (nextEl.style.display !== 'none') {
                hasVisibleProduct = true;
                break;
            }
            nextEl = nextEl.nextElementSibling;
        }
        header.style.display = hasVisibleProduct ? "flex" : "none";
    });
}

document.getElementById('searchProduct').addEventListener('input', jalankanFilterProduk);

perbaruiStatusInternet();
sinkronisasiProduk();
</script>
